name: Validate and deploy the WQI portal

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1. Sanity checks — it is a static site, so there is nothing to
  #    build. We verify JS syntax and the integrity of every dataset.
  # ---------------------------------------------------------------
  validate:
    name: Validate syntax and data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript module syntax
        run: |
          for f in js/*.js; do
            node --check "$f" && echo "  ok  $f"
          done

      - name: Verify every JSON / GeoJSON file parses
        run: |
          python3 - <<'PY'
          import json, glob, sys, os
          failed = 0
          for f in sorted(glob.glob('data/*.json') + glob.glob('data/*.geojson')):
              try:
                  d = json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  print(f'  FAILED  {f}: {e}'); failed += 1; continue
              if isinstance(d, list):
                  n = len(d)
              else:
                  n = len(d.get('features') or d.get('stations') or [])
              print(f'  ok  {f:44} {os.path.getsize(f)//1024:>6} KB  {n:>6} records')
          sys.exit(1 if failed else 0)
          PY

      - name: Verify the WQI formula against one reference case per class
        run: |
          node --input-type=module -e "
          import { computeWQI, wqiClass } from './js/wqi.js';
          const cases = [
            { r: { do: 7.8, bod: 1.2, cod: 8,   ss: 15,  an: 0.05, ph: 6.9 }, cls: 'I'   },
            { r: { do: 6.5, bod: 2.5, cod: 18,  ss: 40,  an: 0.25, ph: 7.0 }, cls: 'II'  },
            { r: { do: 5.2, bod: 4.0, cod: 30,  ss: 70,  an: 0.80, ph: 6.8 }, cls: 'III' },
            { r: { do: 3.0, bod: 8.0, cod: 60,  ss: 200, an: 2.40, ph: 6.5 }, cls: 'IV'  },
            { r: { do: 1.2, bod: 18,  cod: 120, ss: 600, an: 3.80, ph: 5.2 }, cls: 'V'   },
          ];
          let failed = 0;
          for (const k of cases) {
            const { wqi } = computeWQI(k.r);
            const c = wqiClass(wqi).id;
            const ok = c === k.cls;
            if (!ok) failed++;
            console.log(\`  \${ok ? 'ok   ' : 'FAILED'} WQI \${wqi.toFixed(1).padStart(5)} -> Class \${c} (expected \${k.cls})\`);
          }
          process.exit(failed ? 1 : 0);
          "

      - name: Verify every local file referenced by the app exists
        run: |
          python3 - <<'PY'
          import re, os, sys
          html = open('index.html', encoding='utf-8').read()
          refs = set(re.findall(r'(?:src|href)="(?!https?:|#)([^"]+)"', html))
          js = open('js/data.js', encoding='utf-8').read()
          refs |= set(re.findall(r"'(data/[^']+)'", js))
          app = open('js/app.js', encoding='utf-8').read()
          refs |= set(re.findall(r"from '\./([^']+)'", app))
          refs = {r if not r.endswith('.js') or r.startswith('js/') else 'js/' + r for r in refs}
          missing = [r for r in sorted(refs) if not os.path.exists(r)]
          for r in sorted(refs):
              print(('  ok  ' if r not in missing else '  MISSING  ') + r)
          sys.exit(1 if missing else 0)
          PY

  # ---------------------------------------------------------------
  # 2. Publish the repository directory as-is (static site).
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
